[package]
name = "explorer-plus"
version = "0.7.0"
description = "explorer_plus"
authors = ["Neo-Neptunity"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "explorer_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools：インストールした版でも開発者ツールを開けるようにする（MOD を作る人がエラーを見るため。ADR 0020）
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"
png = "0.18.1"
# #[implement] のマクロが、この名前のクレートを直接使う
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Console", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "UI_ViewManagement", "Win32_Globalization"] }
notify = "8.2.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.2"
getrandom = "0.3"
base64 = "0.22"
encoding_rs = "0.8.42"
ureq = "2"
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
